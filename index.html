<!DOCTYPE html><html><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Möbius Transformation Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            position: relative;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            max-width: 300px;
            z-index: 100;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #4fc3f7;
        }
        .slider-container {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .slider-container label {
            width: 80px;
            font-size: 12px;
        }
        .slider-container input[type="range"] {
            flex-grow: 1;
            margin: 0 10px;
        }
        .slider-container .value {
            width: 40px;
            font-size: 12px;
            text-align: right;
        }
        button {
            background: #4fc3f7;
            border: none;
            color: #000;
            padding: 5px 10px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        button:hover {
            background: #29b6f6;
        }
        .toggle-ui {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px;
            cursor: pointer;
            z-index: 101;
        }
        .info-text {
            font-size: 12px;
            margin-top: 10px;
            color: #aaa;
        }
    </style>

<base target="_self">


    </head><body><div id="canvas-container"></div>
    <button class="toggle-ui" onclick="toggleUI()">☰</button>
    <div id="ui-container">
        <div class="control-group">
            <h3>Möbius Parameters</h3>
            <div class="slider-container">
                <label>a (real)</label>
                <input type="range" id="a-real" min="-2" max="2" step="0.01" value="1">
                <span class="value" id="a-real-value">1.00</span>
            </div>
            <div class="slider-container">
                <label>a (imag)</label>
                <input type="range" id="a-imag" min="-2" max="2" step="0.01" value="0">
                <span class="value" id="a-imag-value">0.00</span>
            </div>
            <div class="slider-container">
                <label>b (real)</label>
                <input type="range" id="b-real" min="-2" max="2" step="0.01" value="0">
                <span class="value" id="b-real-value">0.00</span>
            </div>
            <div class="slider-container">
                <label>b (imag)</label>
                <input type="range" id="b-imag" min="-2" max="2" step="0.01" value="0">
                <span class="value" id="b-imag-value">0.00</span>
            </div>
            <div class="slider-container">
                <label>c (real)</label>
                <input type="range" id="c-real" min="-2" max="2" step="0.01" value="0">
                <span class="value" id="c-real-value">0.00</span>
            </div>
            <div class="slider-container">
                <label>c (imag)</label>
                <input type="range" id="c-imag" min="-2" max="2" step="0.01" value="0">
                <span class="value" id="c-imag-value">0.00</span>
            </div>
            <div class="slider-container">
                <label>d (real)</label>
                <input type="range" id="d-real" min="-2" max="2" step="0.01" value="1">
                <span class="value" id="d-real-value">1.00</span>
            </div>
            <div class="slider-container">
                <label>d (imag)</label>
                <input type="range" id="d-imag" min="-2" max="2" step="0.01" value="0">
                <span class="value" id="d-imag-value">0.00</span>
            </div>
        </div>
        
        <div class="control-group">
            <h3>Visualization</h3>
            <div class="slider-container">
                <label>Grid Density</label>
                <input type="range" id="grid-density" min="5" max="50" step="1" value="20">
                <span class="value" id="grid-density-value">20</span>
            </div>
            <div class="slider-container">
                <label>Line Width</label>
                <input type="range" id="line-width" min="0.5" max="3" step="0.1" value="1.5">
                <span class="value" id="line-width-value">1.5</span>
            </div>
            <div class="slider-container">
                <label>Color Mode</label>
                <select id="color-mode" style="flex-grow:1; margin-left:10px;">
                    <option value="0">Phase Angle</option>
                    <option value="1">Magnitude</option>
                    <option value="2">Fixed Points</option>
                </select>
            </div>
        </div>
        
        <div class="control-group">
            <h3>Presets</h3>
            <button onclick="setPreset('identity')">Identity</button>
            <button onclick="setPreset('inversion')">Inversion</button>
            <button onclick="setPreset('rotation')">Rotation</button>
            <button onclick="setPreset('translation')">Translation</button>
            <button onclick="setPreset('scaling')">Scaling</button>
        </div>
        
        <div class="info-text">
            Click and drag to move the view. Scroll to zoom.
        </div>
    </div>

    <script>
        // Check for WebGL support
        if (!WebGLRenderingContext) {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '<div style="color: white; text-align: center; padding: 20px;">Your browser does not support WebGL. Please try with a modern browser.</div>';
            throw new Error('WebGL not supported');
        }

        // Three.js setup
        const container = document.getElementById('canvas-container');
        const aspectRatio = 16/9;
        const maxWidth = 1200;
        const width = Math.min(window.innerWidth, maxWidth);
        const height = width / aspectRatio;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        // Shader material
        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                resolution: { value: new THREE.Vector2(width, height) },
                a: { value: new THREE.Vector2(1, 0) },
                b: { value: new THREE.Vector2(0, 0) },
                c: { value: new THREE.Vector2(0, 0) },
                d: { value: new THREE.Vector2(1, 0) },
                gridDensity: { value: 20 },
                lineWidth: { value: 1.5 },
                colorMode: { value: 0 },
                viewOffset: { value: new THREE.Vector2(0, 0) },
                viewScale: { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;
                
                uniform float time;
                uniform vec2 resolution;
                uniform vec2 a;
                uniform vec2 b;
                uniform vec2 c;
                uniform vec2 d;
                uniform float gridDensity;
                uniform float lineWidth;
                uniform int colorMode;
                uniform vec2 viewOffset;
                uniform float viewScale;
                
                varying vec2 vUv;
                
                // Complex number operations
                vec2 cmul(vec2 z1, vec2 z2) {
                    return vec2(z1.x * z2.x - z1.y * z2.y, z1.x * z2.y + z1.y * z2.x);
                }
                
                vec2 cdiv(vec2 z1, vec2 z2) {
                    float denom = z2.x * z2.x + z2.y * z2.y;
                    return vec2(
                        (z1.x * z2.x + z1.y * z2.y) / denom,
                        (z1.y * z2.x - z1.x * z2.y) / denom
                    );
                }
                
                // Möbius transformation
                vec2 mobius(vec2 z) {
                    vec2 numerator = cmul(a, z) + b;
                    vec2 denominator = cmul(c, z) + d;
                    return cdiv(numerator, denominator);
                }
                
                // Color functions
                vec3 hsv2rgb(vec3 c) {
                    vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                    vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                    return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                }
                
                float grid(vec2 p, float density) {
                    vec2 gridPos = p * density;
                    vec2 gridFract = fract(gridPos) - 0.5;
                    float gridLines = min(abs(gridFract.x), abs(gridFract.y));
                    float lineWidth = 0.5 / density * lineWidth;
                    return smoothstep(lineWidth, 0.0, gridLines);
                }
                
                void main() {
                    // Adjust coordinates for view offset and scale
                    vec2 uv = (vUv - 0.5) * 2.0 * viewScale + viewOffset;
                    
                    // Draw grid in original space
                    float gridValue = grid(uv, gridDensity);
                    
                    // Apply Möbius transformation
                    vec2 transformed = mobius(uv);
                    
                    // Draw grid in transformed space
                    float transformedGrid = grid(transformed, gridDensity);
                    
                    // Calculate color based on mode
                    vec3 color = vec3(0.0);
                    
                    if (colorMode == 0) {
                        // Phase angle coloring
                        float angle = atan(transformed.y, transformed.x);
                        color = hsv2rgb(vec3(angle / (2.0 * 3.1415926535) + 0.5, 0.8, 0.8));
                        } else if (colorMode == 1) {
                        // Disable magnitude coloring for now
                        color = vec3(0.0, 0.5, 1.0); // Use a simple blue color instead
                        } else {
                        // Fixed points coloring
                        color = vec3(0.5);
                        }
                    
                    // Blend grid with background
                    float gridAlpha = max(gridValue, transformedGrid * 0.7);
                    color = mix(color * 0.2, color, gridAlpha);
                    
                    // Add highlight for origin
                    float originDist = length(uv);
                    if (originDist < 0.05) {
                        color = mix(color, vec3(1.0, 1.0, 0.0), smoothstep(0.05, 0.0, originDist));
                    }
                    
                    // Add highlight for transformed origin
                    vec2 transformedOrigin = mobius(vec2(0.0));
                    float transformedOriginDist = length(uv - transformedOrigin);
                    if (transformedOriginDist < 0.05) {
                        color = mix(color, vec3(1.0, 0.0, 1.0), smoothstep(0.05, 0.0, transformedOriginDist));
                    }
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        // Full-screen quad
        const geometry = new THREE.PlaneGeometry(2, 2);
        const quad = new THREE.Mesh(geometry, shaderMaterial);
        scene.add(quad);

        // UI controls
        function updateUniforms() {
            shaderMaterial.uniforms.a.value.set(
                parseFloat(document.getElementById('a-real').value),
                parseFloat(document.getElementById('a-imag').value)
            );
            shaderMaterial.uniforms.b.value.set(
                parseFloat(document.getElementById('b-real').value),
                parseFloat(document.getElementById('b-imag').value)
            );
            shaderMaterial.uniforms.c.value.set(
                parseFloat(document.getElementById('c-real').value),
                parseFloat(document.getElementById('c-imag').value)
            );
            shaderMaterial.uniforms.d.value.set(
                parseFloat(document.getElementById('d-real').value),
                parseFloat(document.getElementById('d-imag').value)
            );
            shaderMaterial.uniforms.gridDensity.value = parseFloat(document.getElementById('grid-density').value);
            shaderMaterial.uniforms.lineWidth.value = parseFloat(document.getElementById('line-width').value);
            shaderMaterial.uniforms.colorMode.value = parseInt(document.getElementById('color-mode').value);
            
            // Update displayed values
            document.getElementById('a-real-value').textContent = document.getElementById('a-real').value;
            document.getElementById('a-imag-value').textContent = document.getElementById('a-imag').value;
            document.getElementById('b-real-value').textContent = document.getElementById('b-real').value;
            document.getElementById('b-imag-value').textContent = document.getElementById('b-imag').value;
            document.getElementById('c-real-value').textContent = document.getElementById('c-real').value;
            document.getElementById('c-imag-value').textContent = document.getElementById('c-imag').value;
            document.getElementById('d-real-value').textContent = document.getElementById('d-real').value;
            document.getElementById('d-imag-value').textContent = document.getElementById('d-imag').value;
            document.getElementById('grid-density-value').textContent = document.getElementById('grid-density').value;
            document.getElementById('line-width-value').textContent = document.getElementById('line-width').value;
        }

        // Presets
        function setPreset(name) {
            switch(name) {
                case 'identity':
                    document.getElementById('a-real').value = 1;
                    document.getElementById('a-imag').value = 0;
                    document.getElementById('b-real').value = 0;
                    document.getElementById('b-imag').value = 0;
                    document.getElementById('c-real').value = 0;
                    document.getElementById('c-imag').value = 0;
                    document.getElementById('d-real').value = 1;
                    document.getElementById('d-imag').value = 0;
                    break;
                case 'inversion':
                    document.getElementById('a-real').value = 0;
                    document.getElementById('a-imag').value = 0;
                    document.getElementById('b-real').value = 1;
                    document.getElementById('b-imag').value = 0;
                    document.getElementById('c-real').value = 1;
                    document.getElementById('c-imag').value = 0;
                    document.getElementById('d-real').value = 0;
                    document.getElementById('d-imag').value = 0;
                    break;
                case 'rotation':
                    const angle = Math.PI/4;
                    document.getElementById('a-real').value = Math.cos(angle);
                    document.getElementById('a-imag').value = Math.sin(angle);
                    document.getElementById('b-real').value = 0;
                    document.getElementById('b-imag').value = 0;
                    document.getElementById('c-real').value = 0;
                    document.getElementById('c-imag').value = 0;
                    document.getElementById('d-real').value = Math.cos(angle);
                    document.getElementById('d-imag').value = -Math.sin(angle);
                    break;
                case 'translation':
                    document.getElementById('a-real').value = 1;
                    document.getElementById('a-imag').value = 0;
                    document.getElementById('b-real').value = 0.5;
                    document.getElementById('b-imag').value = 0.5;
                    document.getElementById('c-real').value = 0;
                    document.getElementById('c-imag').value = 0;
                    document.getElementById('d-real').value = 1;
                    document.getElementById('d-imag').value = 0;
                    break;
                case 'scaling':
                    document.getElementById('a-real').value = 2;
                    document.getElementById('a-imag').value = 0;
                    document.getElementById('b-real').value = 0;
                    document.getElementById('b-imag').value = 0;
                    document.getElementById('c-real').value = 0;
                    document.getElementById('c-imag').value = 0;
                    document.getElementById('d-real').value = 1;
                    document.getElementById('d-imag').value = 0;
                    break;
            }
            updateUniforms();
        }

        // View manipulation
        let isDragging = false;
        let lastMousePos = new THREE.Vector2();
        const viewOffset = new THREE.Vector2(0, 0);
        let viewScale = 1.0;

        function onMouseDown(event) {
            isDragging = true;
            lastMousePos.set(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
        }

        function onMouseMove(event) {
            if (!isDragging) return;
            
            const mousePos = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            
            const delta = mousePos.clone().sub(lastMousePos).multiplyScalar(2.0 / viewScale);
            viewOffset.add(delta);
            shaderMaterial.uniforms.viewOffset.value.copy(viewOffset);
            
            lastMousePos.copy(mousePos);
        }

        function onMouseUp() {
            isDragging = false;
        }

        function onWheel(event) {
            const zoomFactor = 1.1;
            const delta = event.deltaY > 0 ? 1/zoomFactor : zoomFactor;
            
            // Get mouse position in normalized device coordinates
            const mousePos = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            
            // Calculate world position before zoom
            const worldPosBefore = mousePos.clone().multiplyScalar(1.0 / viewScale).sub(viewOffset);
            
            // Apply zoom
            viewScale *= delta;
            viewScale = Math.max(0.1, Math.min(viewScale, 10.0));
            
            // Calculate new view offset to zoom toward mouse position
            const worldPosAfter = mousePos.clone().multiplyScalar(1.0 / viewScale).sub(viewOffset);
            viewOffset.add(worldPosAfter).sub(worldPosBefore);
            
            shaderMaterial.uniforms.viewScale.value = viewScale;
            shaderMaterial.uniforms.viewOffset.value.copy(viewOffset);
            
            event.preventDefault();
        }

        // Event listeners
        document.addEventListener('mousedown', onMouseDown);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        document.addEventListener('wheel', onWheel);

        // UI event listeners
        document.querySelectorAll('input[type="range"], select').forEach(el => {
            el.addEventListener('input', updateUniforms);
        });

        function toggleUI() {
            const ui = document.getElementById('ui-container');
            ui.style.display = ui.style.display === 'none' ? 'block' : 'none';
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            shaderMaterial.uniforms.time.value += 0.01;
            renderer.render(scene, camera);
        }

        // Handle resize
        function onWindowResize() {
            const newWidth = Math.min(window.innerWidth, maxWidth);
            const newHeight = newWidth / aspectRatio;
            
            renderer.setSize(newWidth, newHeight);
            shaderMaterial.uniforms.resolution.value.set(newWidth, newHeight);
        }

        window.addEventListener('resize', onWindowResize);

        // Initialize
        updateUniforms();
        animate();
    </script>

              
          
                
          
              
</body></html>
